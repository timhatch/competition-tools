<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotation & Gap Scheduling Tool</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-page: light-dark(#f4f5f7, #121212);
      --bg-card: light-dark(#fff, #1e1e1e);
      --text: light-dark(#1a1a2e, #e0e0e0);
      --text-muted: light-dark(#6b7280, #9ca3af);
      --text-dim: light-dark(#9ca3af, #6b7280);
      --text-strong: light-dark(#374151, #ccc);
      --border: light-dark(#d1d5db, #555);
      --border-light: light-dark(#e5e7eb, #444);
      --bg-subtle: light-dark(#f9fafb, #222);
      --bg-ghost: light-dark(#f3f4f6, #2a2a2a);
      --bg-hover: light-dark(#f3f4f6, #2a2a2a);
      --shadow-sm: light-dark(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.35));
      --shadow-lg: light-dark(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.45));
      --accent: #3b82f6;
      --accent-bg: light-dark(rgba(59, 130, 246, 0.04), rgba(59, 130, 246, 0.12));
      --good: light-dark(#16a34a, #4ade80);
      --bad: light-dark(#dc2626, #ff6b6b);
      --bad-bg: light-dark(#fef2f2, #5a1f25);
      --warn: light-dark(#d97706, #ffb454);
      --hdr: light-dark(#374151, #2f3b52);
      --mono: 'SF Mono', Menlo, Consolas, monospace;
    }

    html[data-theme="light"] {
      color-scheme: light;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text);
      font-size: 14px
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-wrap: wrap
    }

    header h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 600
    }

    header .sub {
      color: var(--text-muted);
      font-size: 12px
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-left: auto
    }

    .tab {
      padding: 7px 14px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-muted);
      border: 1px solid transparent;
      user-select: none;
      font-weight: 500
    }

    .tab:hover {
      background: var(--bg-ghost);
      color: var(--text)
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent)
    }

    .langsel {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden
    }

    .langsel button {
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: none;
      border-radius: 0;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .5px
    }

    .langsel button.active {
      background: var(--accent);
      color: #fff
    }

    main {
      padding: 20px;
      max-width: 1280px;
      margin: 0 auto
    }

    .view {
      display: none
    }

    .view.active {
      display: block
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px var(--shadow-sm)
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600
    }

    .card h2 .hint {
      font-weight: 400;
      color: var(--text-muted);
      font-size: 12px;
      margin-left: 8px
    }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 4px
    }

    input,
    textarea,
    select {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 13px;
      width: 100%;
      font-family: inherit
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--accent)
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .setup-grid {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr))
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer
    }

    button:hover {
      filter: brightness(1.1)
    }

    button.ghost {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text)
    }

    button.sm {
      padding: 5px 10px;
      font-size: 12px
    }

    button.danger {
      background: transparent;
      color: var(--bad);
      border: 1px solid var(--bad)
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px
    }

    th,
    td {
      border: 1px solid var(--border);
      padding: 5px 8px;
      text-align: left;
      white-space: nowrap
    }

    th {
      background: var(--hdr);
      color: #fff;
      position: sticky;
      top: 0;
      font-weight: 600
    }

    td.mono,
    th.mono {
      font-family: var(--mono);
      font-size: 12px
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    tbody tr:nth-child(even) {
      background: light-dark(rgba(0, 0, 0, 0.02), rgba(255, 255, 255, 0.02))
    }

    .scroll {
      overflow: auto;
      max-height: 70vh;
      border: 1px solid var(--border);
      border-radius: 8px
    }

    .conflict {
      background: var(--bad-bg) !important;
      color: light-dark(#991b1b, #ffd5d5) !important;
      font-weight: 600
    }
    .bad-current {
      background: rgba(239, 68, 68, 0.2) !important
    }
    .bad-current input {
      background: transparent !important;
      color: var(--bad) !important;
      font-weight: 600
    }

    .late {
      background: rgba(255, 180, 84, .22) !important;
      color: var(--warn) !important;
      font-weight: 600
    }

    .gapcell {
      background: rgba(255, 180, 84, .16);
      color: var(--warn);
      font-style: italic;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px
    }

    .pausecell {
      background: light-dark(rgba(59, 130, 246, 0.12), rgba(79, 156, 255, 0.18));
      color: var(--accent);
      font-style: italic;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 600
    }

    .restartcell {
      background: light-dark(rgba(22, 163, 74, 0.15), rgba(63, 185, 80, 0.20));
      color: light-dark(#16a34a, #9ff0a8);
      font-weight: 600
    }

    td.shifted {
      color: var(--text-dim)
    }

    .athcell {
      padding: 3px 9px
    }

    .ath {
      display: flex;
      gap: 9px;
      align-items: baseline;
      white-space: nowrap
    }

    .ath .anum {
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      min-width: 26px;
      text-align: right
    }

    .ath .aname {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .ath .acty {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--accent)
    }

    .ath .rmark {
      color: var(--good);
      font-weight: 700
    }

    .restartcell .anum,
    .restartcell .acty {
      color: light-dark(#16a34a, #9ff0a8)
    }

    .editable {
      background: light-dark(#fef9e7, #2a2516)
    }

    .editable input {
      background: transparent;
      border: none;
      padding: 10px 6px;
      min-height: 38px;
      width: 100%;
      box-sizing: border-box;
      text-align: center
    }

    .editable input:focus {
      background: var(--bg-page);
      border-radius: 4px
    }

    td input {
      padding: 10px 6px;
      min-height: 38px;
      width: 100%;
      box-sizing: border-box
    }

    .muted {
      color: var(--text-muted)
    }

    .ok {
      color: var(--good)
    }

    .warnmsg {
      color: var(--bad);
      font-weight: 600
    }

    .notes {
      background: var(--bg-subtle);
      border-left: 3px solid var(--accent);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6
    }

    .info-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      margin-left: 6px;
      vertical-align: middle;
      background: transparent;
      transition: .15s
    }

    .info-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-bg)
    }

    .popover {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      font-size: 13px;
      line-height: 1.6;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
      display: none;
      max-width: 480px;
      width: 90vw
    }

    .popover.show {
      display: block
    }

    .popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, .25);
      display: none
    }

    .popover-backdrop.show {
      display: block
    }

    .popover-close {
      float: right;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      background: none;
      border: none;
      padding: 0
    }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin: 10px 0 12px;
      font-size: 12px;
      color: var(--text-muted)
    }

    .sw {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 5px
    }

    .ga-input {
      width: 100%;
      text-align: center
    }

    a.dl {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline
    }

    footer {
      text-align: center;
      padding: 18px 20px 24px;
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: .3px;
      border-top: 1px solid var(--border);
      margin-top: 8px
    }

    body.drag-over::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      border: 4px dashed var(--accent);
      background: var(--accent-bg);
      pointer-events: none;
    }

    .data-status {
      font-size: 12px;
      font-weight: 400;
      padding: 8px 14px;
      border-radius: 6px;
      background: light-dark(#f0fdf4, #0a2e1a);
      border: 1px solid light-dark(#bbf7d0, #2d6a3f);
      color: light-dark(#166534, #6cdb8a);
    }

    .data-status.loaded {
      background: light-dark(#f0fdf4, #0a2e1a);
      border-color: light-dark(#bbf7d0, #2d6a3f);
      color: light-dark(#166534, #6cdb8a);
    }

    .data-status.empty {
      background: light-dark(#fefce8, #2e260a);
      border-color: light-dark(#fde68a, #6a5a2d);
      color: light-dark(#92400e, #dbac6c);
    }

    .data-status.error {
      background: light-dark(#fef2f2, #2e0a0a);
      border-color: light-dark(#fecaca, #6a2d2d);
      color: light-dark(#991b1b, #db6c6c);
    }

    @media (max-width: 900px) {
      body {
        padding: 0 12px;
      }

      main {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Rotation Scheduling</h1>
    <span class="sub" id="statusbar"></span>
    <div class="tabs">
      <div class="tab active" data-view="setup" data-i18n="tabSetup"></div>
      <div class="tab" data-view="gap" data-i18n="tabGap"></div>
      <div class="tab" data-view="tz" data-i18n="tabTZ"></div>
    </div>
    <div class="langsel" id="langsel">
      <button data-lang="en">EN</button>
      <button data-lang="de">DE</button>
      <button data-lang="fr">FR</button>
    </div>
  </header>

  <main>
    <!-- ============ SETUP & STARTLIST ============ -->
    <section class="view active" id="view-setup">
      <div class="card">
        <h2><span data-i18n="phaseValues"></span> <span class="hint" data-i18n="phaseHint"></span></h2>
        <div class="grid setup-grid">
          <div><label data-i18n="lblStart"></label><input id="startTime" type="time" step="1" value="12:06:15"></div>
          <div><label data-i18n="lblInterval"></label><input id="interval" type="number" value="315"></div>
          <div><label data-i18n="lblBoulders"></label><input id="boulders" type="number" value="5" min="1" max="8">
          </div>
        </div>
      </div>

      <div class="card" id="importCard">
        <h2>Import Start List</h2>
        <div id="importStatus" class="data-status empty">Drop <strong>.json</strong> or <strong>.csv</strong> here</div>

        <h2 style="margin-top:18px"><span data-i18n="controlSheet"></span> <span class="hint" id="ctrlCount"></span></h2>
        <div class="scroll" style="max-height:55vh">
          <table id="ctrlTable">
            <thead>
              <tr>
                <th style="width:70px" data-i18n="thOrder"></th>
                <th data-i18n="thBib"></th>
                <th data-i18n="thName"></th>
                <th data-i18n="thCountry"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="ghost sm" id="btnAddRow" onclick="addClimber()" data-i18n="btnAddRow"></button>
        </div>
      </div>
    </section>

    <!-- ============ GAP ASSISTANT ============ -->
    <section class="view" id="view-gap">
      <div class="card">
        <h2><span data-i18n="gapTitle"></span> <span class="hint" data-i18n="gapHint"></span>
          <span class="info-btn" id="workflowInfo" title="Workflow help">?</span>
        </h2>
        <div class="popover" id="workflowPopover"><button class="popover-close" id="workflowClose">✕</button>
          <div data-i18n-html="gapNotes"></div>
        </div>
        <div class="popover-backdrop" id="workflowBackdrop"></div>
        <div class="scroll" style="margin-top:12px">
          <table id="gapTable">
            <thead>
              <tr>
                <th data-i18n="thRef"></th>
                <th data-i18n="thBib"></th>
                <th data-i18n="thName"></th>
                <th data-i18n="thCountry"></th>
                <th data-i18n="thBoulder"></th>
                <th data-i18n="thCalc"></th>
                <th data-i18n="thTarget"></th>
                <th data-i18n="thCurrent"></th>
                <th data-i18n="thGap"></th>
                <th data-i18n="thRestart"></th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="ghost sm" onclick="addGapRow()" data-i18n="btnAddRestart"></button>
          <span id="gapStatus" class="ok" style="margin-left:8px"></span>
        </div>
        <div class="legend">
          <span><span class="sw" style="background:rgba(255,180,84,.5)"></span><span data-i18n="legLate"></span></span>
          <span><span class="sw" style="background:var(--panel2)"></span><span data-i18n="legManual"></span></span>
        </div>
      </div>

      <div class="card">
        <h2><span data-i18n="pauseTitle"></span> <span class="hint" data-i18n="pauseHint"></span></h2>
        <div class="notes" data-i18n="pauseNotes"></div>
        <div class="scroll" style="margin-top:12px;max-width:560px">
          <table id="pauseTable">
            <thead>
              <tr>
                <th data-i18n="thFrom"></th>
                <th data-i18n="thDuration"></th>
                <th data-i18n="thReason"></th>
                <th style="width:40px"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="ghost sm" onclick="addPause()" data-i18n="btnAddPause"></button>
        </div>
      </div>

      <div class="card">
        <h2><span data-i18n="schedTitle"></span>
          <button class="ghost sm" style="float:right" onclick="printSchedule()" data-i18n="btnPrint"></button>
        </h2>
        <div class="legend">
          <span><span class="sw" style="background:rgba(255,180,84,.5)"></span><span data-i18n="czGapLeg"></span></span>
          <span><span class="sw" style="background:rgba(63,185,80,.6)"></span><span
              data-i18n="czRestartLeg"></span></span>
          <span><span class="sw" style="background:rgba(79,156,255,.6)"></span><span data-i18n="pauseLeg"></span></span>
        </div>
        <div>
          <table id="czTableGap" class="cz-target"></table>
        </div>
      </div>
    </section>

    <!-- ============ TZ SCHEDULE ============ -->
    <section class="view" id="view-tz">
      <div class="card">
        <h2><span data-i18n="tzTitle"></span> <span class="hint" data-i18n="tzHint"></span>
          <button class="ghost sm" style="float:right" onclick="printSchedule()" data-i18n="btnPrint"></button>
        </h2>
        <div class="grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:12px">
          <div><label data-i18n="lblTransit"></label><input id="transit" type="number" value="315"></div>
          <div><label data-i18n="lblCapacity"></label><input id="capacity" type="number" value="1" min="1"></div>
        </div>
        <div class="legend">
          <span data-i18n="tzLeg1"></span>
          <span data-i18n="tzLeg2"></span>
          <span data-i18n="tzLeg3"></span>
        </div>
        <div class="scroll" style="margin-top:12px">
          <table id="tzTable">
            <thead>
              <tr>
                <th data-i18n="thRotation"></th>
                <th data-i18n="thShuttle"></th>
                <th data-i18n="thAthlete"></th>
                <th data-i18n="thDepart"></th>
                <th data-i18n="thStart"></th>
                <th data-i18n="thWait"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer>© 2026 Tim Hatch. All rights reserved.</footer>

  <datalist id="climberList"></datalist>

  <script>
    // ============ i18n ============
    const I18N = {
      de: {
        tabSetup: "Setup & Startliste", tabTZ: "Transit Zone (TZ)", tabGap: "Call Zone (CZ)",
        statusEmpty: "Keine Startliste geladen", statusLoaded: "{n} Athleten · {r} Rotationen",
        phaseValues: "Phase Values", phaseHint: "Grundeinstellungen – wirken sich sofort auf alle Berechnungen aus",
        lblStart: "Start Time (HH:MM:SS)", lblInterval: "Rotation + Interval (Sek.)", lblBoulders: "Boulders",
        lblTransit: "Transit Time (Sek.)", lblCapacity: "Capacity (Shuttle)",
        importTitle: "Startliste importieren", importHint: "aus Numbers/Excel-Spalte kopieren & einfügen, oder CSV laden",
        importNotes: '<b>Ganz einfach:</b> CSV- oder XLSX-Datei <b>hierher ziehen</b> oder unten „Datei laden" – das Format wird <b>automatisch erkannt</b>. Es funktionieren:<br>• die <b>IFSC-Startliste</b> <span class="mono">101 NAME | NAT , Startreihenfolge</span><br>• eine Tabelle <b>mit Kopfzeile</b> mit diesen 4 Spalten: <span class="mono">Starting Order · Name · Nation · Bib-Number</span><br>• eine <b>xlsx-Datei</b> (Excel 2007+) mit denselben Spalten<br>Zusatzspalten (Kategorie, Jahrgang …) werden ignoriert.',
        importMissing: 'Fehlende Pflichtspalte(n): {cols}',
        btnApply: "Startliste übernehmen", btnCSV: "CSV / XLSX laden…", btnDemo: "Demo-Startliste (39 Athleten)", btnClear: "Leeren",
        infoNothing: "Nichts erkannt.", infoLoaded: "{n} Athleten übernommen ✓",
        mapOpen: "Spalten manuell zuordnen",
        mapAuto: "– automatisch –",
        mapTitle: "Spalten manuell zuordnen",
        mapModeLabel: "Datenformat",
        mapModeSplit: "Getrennte Spalten (Order / Name / Nation / Bib)",
        mapModeCombined: "Kombiniertes Aa-ID (z.B. 101 NAME | NAT)",
        mapHasHeader: "Erste Zeile ist Kopfzeile",
        mapOrderLabel: "Spalte: Starting Order",
        mapAaLabel: "Spalte: Aa-ID",
        mapNameLabel: "Spalte: Name",
        mapNatLabel: "Spalte: Nation",
        mapBibLabel: "Spalte: Bib-Number",
        mapPreviewLabel: "Vorschau (erste 3)",
        mapApply: "Übernehmen",
        mapClose: "Schließen",
        controlSheet: "Control Sheet", count: "{n} Athleten",

    let lang = localStorage.getItem('rotLang') || 'de';
    function t(key, vars) {
      let s = (I18N[lang] && I18N[lang][key]) || (I18N.de[key] || key);
      if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
      return s;
    }
    function applyStatic() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {el.textContent = t(el.dataset.i18n);});
      document.querySelectorAll('[data-i18n-html]').forEach(el => {el.innerHTML = t(el.dataset.i18nHtml);});
      document.querySelectorAll('#langsel button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }
    function setLang(l) {lang = l; localStorage.setItem('rotLang', l); applyStatic(); renderAll();}

    // ============ State ============
    let climbers = []; // {order, name, boulder(null|number)}
    let gapRows = [];  // {bib, boulder, current, select, gap}
    let pauses = [];   // {from, len} full-wall interruptions (rotation range)



    // ============ Settings ============
    const $ = id => document.getElementById(id);
    function S() {
      const tt = $('startTime').value.split(':').map(Number);
      return {
        start: (tt[0] || 0) * 3600 + (tt[1] || 0) * 60 + (tt[2] || 0),
        interval: +$('interval').value || 0,
        boulders: +$('boulders').value || 1,
        transit: +$('transit').value || 0,
        loading: 0,
        capacity: +$('capacity').value || 1,
      };
    }

    // ============ Formatting ============
    const pad = n => String(n).padStart(2, '0');
    function fmtTime(sec) {
      sec = Math.round(sec); let neg = sec < 0; sec = Math.abs(sec);
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      return (neg ? '-' : '') + pad(h) + ':' + pad(m) + ':' + pad(s);
    }
    function fmtDur(sec) {
      sec = Math.round(sec); let neg = sec < 0; sec = Math.abs(sec);
      const m = Math.floor(sec / 60), s = sec % 60;
      return (neg ? '-' : '') + (m > 0 ? m + 'm ' + pad(s) + 's' : s + 's');
    }
    function escAttr(s) {return (s || '').toString().replace(/"/g, '&quot;');}
    function escHtml(s) {return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');}
    // Split "301 SCHALCK         | FRA" -> {num, name, country} for clean column layout.
    function athHtml(bib, name, country, restart) {
      return '<div class="ath">' +
        (restart ? '<span class="rmark">⟳</span>' : '') +
        '<span class="anum">' + escHtml(String(bib || '').padStart(3, '0')) + '</span>' +
        '<span class="aname">' + escHtml(name) + '</span>' +
        (country ? '<span class="acty">' + escHtml(country) + '</span>' : '') +
        '</div>';
    }

    // ---- Drag-and-drop JSON / CSV loading ----
    let dragged = false;
    document.addEventListener('dragover', function (e) {
      if (e.dataTransfer.types.includes('Files')) {
        e.preventDefault();
        document.body.classList.add('drag-over');
        dragged = false;
      }
    });
    document.addEventListener('dragleave', function (e) {
      if (!e.relatedTarget || e.relatedTarget.nodeName === 'HTML') {
        document.body.classList.remove('drag-over');
      }
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      document.body.classList.remove('drag-over');
      const file = Array.from(e.dataTransfer.files).find(f => f.name.endsWith('.json') || f.name.endsWith('.csv'));
      if (!file) {
        $('importStatus').textContent = 'Please drop a .json or .csv file.';
        $('importStatus').className = 'data-status error';
        return;
      }
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const text = ev.target.result;
          let arr;
          if (file.name.endsWith('.json')) {
            arr = JSON.parse(text);
            if (!Array.isArray(arr)) arr = arr.athletes;
          } else {
            arr = parseCSV(text);
          }
          if (!Array.isArray(arr) || arr.length === 0 || !arr[0].name) {
            throw new Error('Invalid format \u2014 expected {bib,name,country,order}');
          }
          climbers = arr.map(item => ({
            order: item.order,
            bib: item.bib,
            name: item.name,
            country: item.country || '',
            boulder: null
          }));
          renderAll();
          $('importStatus').textContent = 'Loaded ' + climbers.length + ' athletes';
          $('importStatus').className = 'data-status loaded';
        } catch (err) {
          $('importStatus').textContent = 'Error: ' + err.message;
          $('importStatus').className = 'data-status error';
        }
      };
      reader.readAsText(file);
    });

    // ---- CSV parser ----
    function parseCSV(text) {
      const lines = [];
      let cur = '', inQ = false;
      for (const ch of text) {
        if (ch === '"') { inQ = !inQ; continue; }
        if (ch === '\n' && !inQ) { lines.push(cur); cur = ''; continue; }
        if (ch === '\r') continue;
        cur += ch;
      }
      if (cur) lines.push(cur);
      if (lines.length < 2) throw new Error('CSV must have a header row and at least one data row');
      const rawHeaders = lines[0];
      const delim = rawHeaders.includes(';') ? ';' : ',';
      const headers = rawHeaders.split(delim).map(h => h.trim());
      const numeric = ['bib', 'order', 'route'];
      return lines.slice(1).map(line => {
        const values = [];
        let f = '', q = false;
        for (const ch of line) {
          if (ch === '"') { q = !q; continue; }
          if (ch === delim && !q) { values.push(f); f = ''; continue; }
          f += ch;
        }
        values.push(f);
        const obj = {};
        headers.forEach((h, i) => {
          let v = i < values.length ? values[i].trim() : '';
          if (v === '') v = null;
          else if (numeric.includes(h)) v = parseInt(v, 10);
          obj[h] = v;
        });
        return obj;
      });
    }
    function addClimber() {
      const order = climbers.length ? Math.max(...climbers.map(c => c.order)) + 1 : 1;
      climbers.push({order, bib: null, name: '', country: '', boulder: null}); renderAll();
    }

    // ============ Lookups ============
    function orderMap() {const m = new Map(); climbers.forEach(c => m.set(c.order, c)); return m;}
    function maxOrder() {return climbers.length ? Math.max(...climbers.map(c => c.order)) : 0;}
    function numRotations(s) {return maxOrder() > 0 ? maxOrder() + (s.boulders - 1) * 2 : 0;}
    function czCell(rotn, boulderIdx, m, s) {
      if (boulderIdx > s.boulders) return '';
      const lookup = rotn - (boulderIdx - 1) * 2;
      const c = m.get(lookup);
      if (!c || !c.name) return '';
      const b = c.boulder;
      return (b == null || b === 0 || b === boulderIdx) ? c.name : '';
    }

    // --- Effective (adapted) start list incl. planned restarts -------------------
    // Each completed Gap-Assistant row inserts ONE empty slot at rotation = Gap Rn.
    // That slot travels empty (GAP) across ALL boulders; only on the restart boulder
    // (at Restart Rn) does the athlete re-climb that single boulder again – his
    // original run stays untouched. Inserting shifts every later entry one rotation.
    // A restart request that is fully specified (athlete + boulder + current rotation).
    function restartRequests() {
      const s = S();
      return gapRows.map((row, idx) => {
        const c = climberByBib(+row.bib), b = +row.boulder, cur = numOrNull(row.current), tg = targetRn(row, s);
        if (!c || !b || cur == null || tg == null) return null;
        return {idx, bib: c.bib, name: c.name, country: c.country, b, C: cur, T: tg};   // C=Current Rn, T=Target Rn
      }).filter(Boolean);
    }
    // Plan that uses as FEW gaps as possible: one inserted gap diagonal can host
    // several restarts (one per boulder). A restart reuses an existing gap whenever
    // that gap has a free cell on its boulder at a feasible rotation (>= Target and
    // in the future) that is no later than a fresh gap would give; otherwise a new
    // gap is opened. Rules honoured: restart never before Target, never in the past.
    function computeGapPlan() {
      const reqs = restartRequests().slice().sort((a, b) => (a.T - b.T) || (a.b - b.b));
      const gaps = [];        // {order, used:{boulder:name}}
      const assign = {};      // gapRows index -> {gapOrder, R}
      reqs.forEach(q => {
        const freshOrder = Math.max(q.C + 1, q.T - (q.b - 1) * 2);
        const freshR = freshOrder + (q.b - 1) * 2;          // = max(T, C+1+(b-1)*2)
        let best = null;                                   // try to reuse an existing gap
        gaps.forEach(g => {
          if (g.used[q.b]) return;                        // that boulder cell already taken
          const R = g.order + (q.b - 1) * 2;
          if (R < q.T || R < q.C + 1) return;               // too early -> not allowed
          if (R > freshR) return;                         // a fresh gap would be earlier
          if (!best || R < best.R) best = {g, R};
        });
        if (best) {best.g.used[q.b] = {bib: q.bib, name: q.name, country: q.country}; assign[q.idx] = {gapOrder: best.g.order, R: best.R};}
        else {
          const g = {order: freshOrder, used: {}}; g.used[q.b] = {bib: q.bib, name: q.name, country: q.country}; gaps.push(g);
          assign[q.idx] = {gapOrder: freshOrder, R: freshR};
        }
      });
      return {gaps, assign};
    }
    function effectiveEntries() {
      const entries = climbers.filter(c => c.bib)
        .map(c => ({type: 'a', bib: c.bib, name: c.name, country: c.country, boulder: c.boulder, key: c.order}));
      computeGapPlan().gaps.forEach(g =>
        entries.push({type: 'r', used: g.used, key: g.order - 0.5}));
      entries.sort((a, b) => a.key - b.key);   // index+1 = effective rotation
      return entries;
    }
    // TZ entries: same athletes as CZ, but gaps shifted earlier by transit time.
    // Gap placement logic (per CZ gap at rotation g.order):
    //   1. raw = g.order - transitRot   — offset gap earlier by transit time
    //   2. tzOrder = max(raw, decisionRot + 1)  — never at/before the decision
    // transitRot = ceil(transit / interval); decisionRot = max{current} of gapRows using this gap.
    function tzEffectiveEntries() {
      const s = S();
      const entries = climbers.filter(c => c.bib)
        .map(c => ({type: 'a', bib: c.bib, name: c.name, country: c.country, boulder: c.boulder, key: c.order}));
      const czPlan = computeGapPlan();
      const transitRot = Math.ceil(s.transit / s.interval);
      czPlan.gaps.forEach(g => {
        let maxCur = null;
        for (const [bStr, info] of Object.entries(g.used)) {
          const row = gapRows.find(r => +r.bib === info.bib && +r.boulder === +bStr);
          if (row) {
            const cur = numOrNull(row.current);
            if (cur != null && (maxCur == null || cur > maxCur)) maxCur = cur;
          }
        }
        const desiredDisplay = maxCur != null
          ? Math.max(g.order - 1 - transitRot, maxCur + 1)
          : Math.max(g.order - 1 - transitRot, 1);
        const keyBase = desiredDisplay + 1 + transitRot;
        entries.push({type: 'r', used: g.used, key: keyBase - 0.5});
      });
      entries.sort((a, b) => a.key - b.key);
      return entries;
    }
    // returns null | {name} | {gap:true} | {name, restart:true}
    function czCellEff(rotn, boulderIdx, entries, s) {
      if (boulderIdx > s.boulders) return null;
      const idx = rotn - (boulderIdx - 1) * 2 - 1;   // 0-based into entries
      if (idx < 0 || idx >= entries.length) return null;
      const e = entries[idx];
      if (e.type === 'a') {
        const b = e.boulder;
        return (b == null || b === 0 || b === boulderIdx) ? {bib: e.bib, name: e.name, country: e.country} : null;
      }
      // shared gap slot: GAP on every boulder except the ones hosting a restart
      const who = e.used[boulderIdx];
      return who ? {bib: who.bib, name: who.name, country: who.country, restart: true} : {gap: true};
    }

    // Valid, sorted full-wall pauses.
    function pauseList() {
      return pauses.map(p => ({from: +p.from, len: +p.len, reason: (p.reason || '').trim()}))
        .filter(p => Number.isFinite(p.from) && p.from >= 1 && Number.isFinite(p.len) && p.len >= 1)
        .sort((a, b) => a.from - b.from);
    }
    // Display rows: lays full-wall pauses on top of the (restart-adjusted) schedule.
    // A pause blanks ALL boulders for its rows and pushes every later rotation back.
    function buildRows() {
      const entries = effectiveEntries(), s = S();
      const Lmax = entries.length ? entries.length + (s.boulders - 1) * 2 : 0;
      const ps = pauseList();
      const rows = []; let logical = 1, disp = 1, k = 0;
      while (logical <= Lmax) {
        while (k < ps.length && ps[k].from <= disp) {
          for (let j = 0; j < ps[k].len; j++) {rows.push({disp, pause: true, reason: ps[k].reason}); disp++;}
          k++;
        }
        rows.push({disp, pause: false, logical}); disp++; logical++;
      }
      return {rows, entries};
    }

    // ============ Render: Control Sheet ============
    function renderCtrl() {
      const tb = $('ctrlTable').querySelector('tbody'); tb.innerHTML = '';
      climbers.sort((a, b) => a.order - b.order);
      climbers.forEach((c, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="num">' + c.order + '</td>' +
          '<td class="mono"><input value="' + escAttr(c.bib) + '" data-i="' + i + '" data-f="bib" class="mono"></td>' +
          '<td class="mono"><input value="' + escAttr(c.name) + '" data-i="' + i + '" data-f="name" class="mono"></td>' +
          '<td class="mono"><input value="' + escAttr(c.country) + '" data-i="' + i + '" data-f="country" class="mono"></td>';
        tb.appendChild(tr);
      });
      tb.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => {
        const i = +e.target.dataset.i, f = e.target.dataset.f;
        if (f === 'bib') climbers[i].bib = e.target.value ? +e.target.value : null;
        else if (f === 'country') climbers[i].country = e.target.value;
        else climbers[i].name = e.target.value;
        renderCZ(); renderTZ(); updateStatus();
      }));
      $('ctrlCount').textContent = climbers.length ? t('count', {n: climbers.length}) : '';
      $('btnAddRow').style.display = climbers.length ? 'none' : '';
      updateStatus();
      const dl = $('climberList'); dl.innerHTML = '';
      climbers.forEach(c => {const o = document.createElement('option'); o.value = c.bib; o.label = c.bib + ' ' + c.name + (c.country ? ' | ' + c.country : ''); dl.appendChild(o);});
    }
    function updateStatus() {
      $('statusbar').textContent = climbers.length
        ? t('statusLoaded', {n: climbers.length, r: buildRows().rows.length})
        : t('statusEmpty');
    }

    // ============ Render: CZ ============
    function renderCZ() {
      const s = S(), {rows, entries} = buildRows();
      let head = '<thead><tr><th>' + t('thRotation') + '</th><th>' + t('thStart') + '</th>';
      for (let b = 1; b <= s.boulders; b++) head += '<th>' + t('thBoulder') + ' ' + b + '</th>';
      head += '</tr></thead>';
      let body = '<tbody>';
      rows.forEach(row => {
        const start = fmtTime(s.start + s.interval * (row.disp - 1));
        body += '<tr><td class="num">' + row.disp + '</td><td class="num">' + start + '</td>';
        if (row.pause) {
          const lbl = 'PAUSE' + (row.reason ? ' — ' + escHtml(row.reason) : '');
          body += '<td class="pausecell" colspan="' + s.boulders + '">' + lbl + '</td>';
        } else {
          for (let b = 1; b <= s.boulders; b++) {
            const cell = czCellEff(row.logical, b, entries, s);
            if (!cell) body += '<td></td>';
            else if (cell.gap) body += '<td class="gapcell">GAP</td>';
            else body += '<td class="athcell' + (cell.restart ? ' restartcell' : '') + '">' + athHtml(cell.bib, cell.name, cell.country, cell.restart) + '</td>';
          }
        }
        body += '</tr>';
      });
      const html = head + body + '</tbody>';
      document.querySelectorAll('.cz-target').forEach(tab => tab.innerHTML = html);
    }

    // ============ Render: TZ ============
    // TZ table columns: Transit-Rn, Shuttle, Athlete/GAP, Depart, Start, CZ Wait
    //   Transit-Rn  = rotation when the shuttle departs (in transit time) — Math.floor((depart-start)/interval)+1
    //   Shuttle     = shuttle group for this entry
    //   Athlete/GAP = athlete name, or "GAP" if no athlete in transit at this rotation
    //   Depart      = clock time the shuttle leaves transit zone
    //   Start       = clock time the athlete starts climbing in CZ (from CZ sheet)
    //   CZ Wait     = time the athlete waits in call zone before starting
    //
    // Rows are built from TZ-specific entries (gaps shifted earlier by transit time, clamped after decision).
    // Start times are looked up from CZ rows so they match the CZ sheet exactly.
    function renderTZ() {
      const s = S(), tb = $('tzTable').querySelector('tbody');
      tb.innerHTML = '';

      // Build CZ start-time lookup: bib -> CZ display rotation
      const {rows: czRows, entries: czEntries} = buildRows();
      const bibCzDisp = {};
      czRows.forEach(r => {
        if (r.pause) return;
        const cell = czCellEff(r.logical, 1, czEntries, s);
        if (cell && !cell.gap && cell.bib) bibCzDisp[cell.bib] = r.disp;
      });

      // Build TZ entries and rows
      const entries = tzEffectiveEntries();
      const Lmax = entries.length, ps = pauseList();
      const rows = []; let logical = 1, disp = 1, k = 0;
      while (logical <= Lmax) {
        const shuttle = Math.floor((logical - 1) / s.capacity) + 1;
        const firstLogical = (shuttle - 1) * s.capacity + 1;
        const rawDepart = s.start + s.interval * (firstLogical - 1) - s.interval - s.transit - s.loading;
        const rawTzRot = Math.floor((rawDepart - s.start) / s.interval) + 1;
        while (k < ps.length && ps[k].from <= rawTzRot) {
          for (let j = 0; j < ps[k].len; j++) {rows.push({disp, pause: true, reason: ps[k].reason, pauseDisp: ps[k].from + j}); disp++;}
          k++;
        }
        rows.push({disp, pause: false, logical}); disp++; logical++;
      }
      rows.forEach(row => {
        const tr = document.createElement('tr');
        if (row.pause) {
          const lbl = 'PAUSE' + (row.reason ? ' — ' + escHtml(row.reason) : '');
          tr.innerHTML = '<td class="num">' + row.pauseDisp + '</td><td class="num muted">–</td><td class="pausecell">' + lbl + '</td>' +
            '<td class="num muted">–</td><td class="num muted">–</td><td class="num muted">–</td>';
          tb.appendChild(tr); return;
        }
        const idx = row.logical - 1;
        if (idx < 0 || idx >= entries.length) return;
        const e = entries[idx];
        // e is either an athlete entry (type 'a') or a gap entry (type 'r')
        // Gap entries carry a 'used' map: boulder# -> {bib, name, country} for restarts hosted in that gap
        let cell;
        if (e.type === 'a') {
          cell = {bib: e.bib, name: e.name, country: e.country};
        } else {
          const w = e.used[1];
          cell = w
            ? {bib: w.bib, name: w.name, country: w.country, restart: true}
            : {gap: true};
        }
        const czDispRot = cell.gap ? row.disp : (bibCzDisp[cell.bib] || row.disp);
        const czStart = s.start + s.interval * (czDispRot - 1);
        const shuttle = Math.floor((row.logical - 1) / s.capacity) + 1;
        const firstLogical = (shuttle - 1) * s.capacity + 1;
        const rawDepart = s.start + s.interval * (firstLogical - 1) - s.interval - s.transit - s.loading;
        const rawTzRot = Math.floor((rawDepart - s.start) / s.interval) + 1;
        let departShift = 0;
        for (const p of ps) {
          if (rawTzRot >= p.from) departShift += p.len;
        }
        const departDisp = firstLogical + departShift;
        const depart = s.start + s.interval * (departDisp - 1) - s.interval - s.transit - s.loading;
        const wait = czStart - depart - s.transit - s.loading;
        const tzRot = Math.floor((depart - s.start) / s.interval) + 1;
        const displayTzRot = tzRot < 1 ? tzRot - 1 : tzRot;
        if (cell.gap) {
          tr.innerHTML = '<td class="num">' + displayTzRot + '</td><td class="num">' + shuttle + '</td><td class="gapcell">GAP</td>' +
            '<td class="num">' + fmtTime(depart) + '</td>' +
            '<td class="num">' + fmtTime(czStart) + '</td><td class="num muted">–</td>';
        } else {
          tr.innerHTML = '<td class="num">' + displayTzRot + '</td><td class="num">' + shuttle + '</td><td class="athcell' + (cell.restart ? ' restartcell' : '') + '">' +
            athHtml(cell.bib, cell.name, cell.country, cell.restart) + '</td>' +
            '<td class="num">' + fmtTime(depart) + '</td>' +
            '<td class="num">' + fmtTime(czStart) + '</td><td class="num">' + fmtDur(wait) + '</td>';
        }
        tb.appendChild(tr);
      });
    }

    // ============ Gap Assistant ============
    function climberByBib(bib) {return climbers.find(c => c.bib === bib);}
    function numOrNull(v) {if (v === '' || v == null) return null; const n = +v; return isNaN(n) ? null : n;}
    function calcRn(row) {
      const c = climberByBib(+row.bib); const b = +row.boulder;
      if (!c || !b) return null; return c.order + (b - 1) * 2;
    }
    function targetRn(row, s) {
      const cr = calcRn(row); const b = +row.boulder;
      if (cr == null || !b) return null; return (s.boulders - b) * 2 + (cr + 2);
    }
    function rotationCol(row) {
      const g = numOrNull(row.select), b = +row.boulder;
      if (g == null || !b) return null; return g - (b - 1) * 2;
    }
    // Auto-suggested Gap Rn = MAX(Current+1, Target-(2*Boulder-2)); '-' until Current Rn set
    function gapRn(row, s) {
      const cur = numOrNull(row.current), tgt = targetRn(row, s), b = +row.boulder;
      if (cur == null) return null; if (tgt == null || !b) return null;
      return Math.max(cur + 1, tgt - (2 * b - 2));
    }
    function restartRn(row, s) {
      const g = gapRn(row, s), b = +row.boulder;
      if (g == null || !b) return null; return g + (2 * b - 2);
    }
    function addGapRow() {gapRows.push({bib: '', boulder: '', current: '', select: '', gap: ''}); renderGap();}

    // Build the rows ONCE (inputs stay alive so focus is never lost while typing).
    function renderGap() {
      const tb = $('gapTable').querySelector('tbody'); tb.innerHTML = '';
      gapRows.forEach((row, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="num">' + (i + 1) + '</td>' +
          '<td class="editable mono"><input list="climberList" class="mono" value="' + escAttr(row.bib) + '" data-i="' + i + '" data-f="bib"></td>' +
          '<td class="cell-gapname mono"></td>' +
          '<td class="cell-gapcty"></td>' +
          '<td class="editable"><input class="ga-input" inputmode="numeric" value="' + escAttr(row.boulder) + '" data-i="' + i + '" data-f="boulder"></td>' +
          '<td class="num cell-orig"></td>' +
          '<td class="num cell-target"></td>' +
           '<td class="editable cell-current"><input class="ga-input" inputmode="numeric" value="' + escAttr(row.current) + '" data-i="' + i + '" data-f="current"></td>' +
          '<td class="num cell-gap"></td>' +
          '<td class="num cell-restart"></td>' +
          '<td><button class="danger sm" data-delg="' + i + '">✕</button></td>';
        tb.appendChild(tr);
      });
      tb.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => {
        const i = +e.target.dataset.i, f = e.target.dataset.f;
        gapRows[i][f] = e.target.value; refreshGapComputed();   // update only outputs, keep focus
      }));
      tb.querySelectorAll('[data-delg]').forEach(b => b.addEventListener('click', e => {
        gapRows.splice(+e.target.dataset.delg, 1); renderGap();
      }));
      refreshGapComputed();
    }
    // Recompute derived cells in place – never touches the <input> elements.
    function refreshGapComputed() {
      const s = S();
      const plan = computeGapPlan();
      const trs = $('gapTable').querySelectorAll('tbody tr');
      let lateCount = 0, beforeOrigCount = 0;
      gapRows.forEach((row, i) => {
        const tr = trs[i]; if (!tr) return;
        const c = row.bib ? climberByBib(+row.bib) : null;
        const cr = calcRn(row), tg = targetRn(row, s);
        const a = plan.assign[i];
        const gap = a ? a.gapOrder : null;
        const rest = a ? a.R : null;
        const curSet = numOrNull(row.current) != null;
        const late = rest != null && tg != null && rest > tg;   // decision too late: ideal target missed
        const beforeOrig = curSet && cr != null && +row.current < cr;
        if (late) lateCount++;
        if (beforeOrig) beforeOrigCount++;
        tr.querySelector('.cell-gapname').textContent = c ? c.name : '';
        tr.querySelector('.cell-gapcty').textContent = c ? c.country : '';
        tr.querySelector('.cell-orig').innerHTML = cr != null ? cr : (row.bib ? '<span class="muted">?</span>' : '');
        const curCell = tr.querySelector('.cell-current');
        if (curCell) curCell.classList.toggle('bad-current', beforeOrig);
        tr.querySelector('.cell-target').textContent = tg ?? '';
        const gc = tr.querySelector('.cell-gap');
        gc.textContent = gap ?? (curSet ? '' : '-');
        gc.classList.toggle('late', late);
        const rc = tr.querySelector('.cell-restart');
        rc.textContent = rest ?? (curSet ? '' : '-');
        rc.classList.toggle('late', late);
        rc.title = late ? t('gapLateTip') : '';
      });
      // efficiency feedback: how many restarts fit into how few gaps
      const nRe = Object.keys(plan.assign).length, nGap = plan.gaps.length;
      let status = nRe ? '<span class="ok">' + t('gapEff', {r: nRe, g: nGap}) + '</span>' : '';
      if (lateCount) status += ' &nbsp;<span style="color:var(--warn)">' + t('gapLate', {n: lateCount}) + '</span>';
      if (beforeOrigCount) status += ' &nbsp;<span style="color:var(--bad)">⚠ ' + beforeOrigCount + ' Current &lt; Orig</span>';
      $('gapStatus').innerHTML = status;
      // a planned restart reshapes the schedule -> refresh CZ + TZ live
      renderCZ(); renderTZ(); updateStatus();
    }

    // ============ Pause / Stop ============
    function addPause() {pauses.push({from: '', len: '', reason: ''}); renderPause();}
    function renderPause() {
      const tb = $('pauseTable').querySelector('tbody'); tb.innerHTML = '';
      pauses.forEach((p, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="editable"><input class="ga-input" inputmode="numeric" value="' + escAttr(p.from) + '" data-i="' + i + '" data-f="from"></td>' +
          '<td class="editable"><input class="ga-input" inputmode="numeric" value="' + escAttr(p.len) + '" data-i="' + i + '" data-f="len"></td>' +
          '<td class="editable"><input style="width:200px;text-align:left" value="' + escAttr(p.reason) + '" data-i="' + i + '" data-f="reason" placeholder="z.B. Regen / Baustelle B3"></td>' +
          '<td><button class="danger sm" data-delp="' + i + '">✕</button></td>';
        tb.appendChild(tr);
      });
      tb.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => {
        const i = +e.target.dataset.i, f = e.target.dataset.f;
        pauses[i][f] = e.target.value; renderCZ(); renderTZ(); updateStatus();   // update schedule, keep focus
      }));
      tb.querySelectorAll('[data-delp]').forEach(b => b.addEventListener('click', e => {
        pauses.splice(+e.target.dataset.delp, 1); renderPause(); renderCZ(); renderTZ(); updateStatus();
      }));
    }

    // ============ Print ============
    function printSchedule() {
      const s = S();
      const meta = t('printSettings', {start: $('startTime').value, iv: s.interval, b: s.boulders, c: s.capacity})
        + ' — ' + t('printGen') + ' ' + new Date().toLocaleString();
      const cz = $('czTableGap').outerHTML, tz = $('tzTable').outerHTML;
      const css =
        'body{font-family:-apple-system,Arial,sans-serif;color:#111;margin:20px}' +
        'h1{font-size:18px;margin:0 0 4px}' +
        'h2{font-size:12px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.5px;color:#333}' +
        '.meta{font-size:11px;color:#555;margin-bottom:8px}' +
        'table{border-collapse:collapse;width:100%;font-size:10.5px;margin-bottom:6px}' +
        'th,td{border:1px solid #aaa;padding:2px 5px;text-align:left;white-space:nowrap}' +
        'th{background:#2f3b52;color:#fff}' +
        '.num{text-align:right} .mono{font-family:Menlo,Consolas,monospace}' +
        '.athcell{padding:2px 7px}' +
        '.ath{display:flex;gap:9px;align-items:baseline}' +
        '.ath .anum{color:#555;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}' +
        '.ath .aname{flex:1}' +
        '.ath .acty{font-size:10px;font-weight:bold;color:#15407a;letter-spacing:.5px}' +
        '.ath .rmark{color:#176117;font-weight:bold}' +
        '.gapcell{background:#ffe7c2;color:#7a5200;text-align:center;font-style:italic}' +
        '.restartcell{background:#d4f5d4;color:#176117;font-weight:bold}' +
        '.pausecell{background:#d6e6ff;color:#15407a;text-align:center;font-weight:bold;font-style:italic}' +
        '.muted{color:#999}' +
        '@page{margin:10mm}';
      const w = window.open('', '_blank', 'width=1000,height=760');
      if (!w) {alert('Popup blocked – please allow popups for printing.'); return;}
      w.document.write('<!DOCTYPE html><html lang="' + lang + '"><head><meta charset="utf-8">' +
        '<title>' + t('czTitle') + '</title><style>' + css + '</style></head><body>' +
        '<h1>' + t('czTitle') + '</h1><div class="meta">' + meta + '</div>' +
        '<h2>' + t('printCZ') + '</h2>' + cz +
        '<h2 style="page-break-before:always">' + t('printTZ') + '</h2>' + tz +
        '</body></html>');
      w.document.close(); w.focus();
      setTimeout(() => {try {w.print();} catch (e) { } }, 350);
    }

    // ============ Orchestration ============
    function recalc() {renderCZ(); renderTZ(); renderGap(); renderCtrl();}
    function renderAll() {renderCtrl(); renderPause(); renderCZ(); renderTZ(); renderGap();}

    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
      t.classList.add('active'); $('view-' + t.dataset.view).classList.add('active');
    }));
    document.querySelectorAll('#langsel button').forEach(b =>
      b.addEventListener('click', () => setLang(b.dataset.lang)));
    ['startTime', 'interval', 'boulders', 'transit', 'capacity'].forEach(id =>
      $(id).addEventListener('input', recalc));
    function toggleWorkflow(show) {
      $('workflowPopover').classList.toggle('show', show);
      $('workflowBackdrop').classList.toggle('show', show);
    }
    $('workflowInfo').addEventListener('click', () => {
      const s = !$('workflowPopover').classList.contains('show');
      toggleWorkflow(s);
    });
    $('workflowClose').addEventListener('click', () => toggleWorkflow(false));
    $('workflowBackdrop').addEventListener('click', () => toggleWorkflow(false));

    // ============ Init ============
    applyStatic();
  </script>
</body>

</html>
